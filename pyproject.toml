[project]
name = "expense-report-refactoring-python-kata"
version = "1.0.0"
description = "Expense Report Refactoring Python Kata"
authors = [{ name = "Codding Cuddles" }]
requires-python = ">=3.11"

dependencies = [
    "pytest>=9.1.1"
]

[dependency-groups]
dev = [
    "ruff>=0.16.2"
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
